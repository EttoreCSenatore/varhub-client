name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit (the tag in the comment): a moved tag cannot change
# what runs with this repository's credentials. Update both together (Dependabot does).
jobs:
  app:
    name: App (lint and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Dependency licenses (AGPL-3.0 compatible)
        run: python3 scripts/auditar-licencas.py --npm .
      - run: npm test
      - run: npm run build

  docs:
    name: Docs (build pt-BR and English)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Dependency licenses of the docs site
        run: python3 ../scripts/auditar-licencas.py --npm website
      - name: Documentation in Portuguese and English (same structure)
        run: python3 ../scripts/checar-traducao.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/build

  image:
    name: Web image and production stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The production Compose file is valid
        run: |
          printf 'POSTGRES_PASSWORD=x\nJWT_SECRET=xxxxxxxxxxxxxxxxxxxx\n' > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f deploy/docker-compose.prod.yml config -q
      - name: Build the web image
        run: docker build -t varhub-web:ci .
      - name: Caddy serves the app and falls back to index.html
        run: |
          docker run -d --name web -p 8080:80 -e API_UPSTREAM=127.0.0.1:9 varhub-web:ci
          for i in $(seq 1 20); do curl -fs -o /dev/null localhost:8080/ && break; sleep 1; done
          curl -fs localhost:8080/projects/1 | grep -q '<div id="root">'
          curl -sI localhost:8080/ | grep -qi 'x-content-type-options: nosniff'

  backup:
    name: Backup and restore test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: EttoreCSenatore/varhub-server
          path: varhub-server
          persist-credentials: false
      - name: A backup restores into an identical database
        run: deploy/test_backup.sh --server-dir varhub-server

  # Publishes the web image to GitHub Packages (ghcr.io). The production Compose file pulls it.
  publish:
    needs: [app, docs, image, backup]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # ghcr.io/ettorecsenatore/varhub-web
    env:
      IMAGE: ghcr.io/ettorecsenatore/varhub-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin ghcr.io
      - name: Build and publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAGS=(-t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::12}")
          # The version tag points to the first image of that version and is never moved.
          if ! docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            TAGS+=(-t "$IMAGE:$VERSION")
          fi
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" "${TAGS[@]}" .
          docker push --all-tags "$IMAGE"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [app, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # GitHub Release of each new version: after the image is published, the version of package.json
  # (the top of releases.yaml; the tests check they match) gets its tag vX.Y.Z and its release, with
  # the notes from releases.yaml, when they do not exist yet. Nobody has to remember.
  release:
    needs: [publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Release of the new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already published."
            exit 0
          fi
          node scripts/release-notes.js "$VERSION" --title > title.txt
          node scripts/release-notes.js "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md --latest
